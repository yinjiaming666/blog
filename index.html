<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="个人技术博客，记录开发笔记与学习心得。" />
  <title>我的个人博客</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f8fafc;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { max-width: 580px; width: 100%; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 16px; }
    p { color: #475569; font-size: 1.1rem; line-height: 1.8; }
    .label { font-size: .9rem; letter-spacing: .08em; color: #2563eb; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <div class="label">PERSONAL BLOG</div>
    <h1>欢迎来到我的博客</h1>
    <p>GitHub Pages 已准备就绪。后续将迁移 Markdown 文章与分类，并接入 Hugo 自动生成博客页面。</p>
  </main>
</body>
</html>
