<h2>16进制</h2>
<p>A B C D E F 分别对应 10 11 12 13 14 15 16</p>
<h3>转换规则</h3>
<p><code>2B = 2 * 16¹ + 11 * 16⁰</code></p>
<p><code>2BB = (2 * 16²) + (11 * 16¹) + 11 * 16⁰</code></p>
<p><code>ABAA = (10 * 16 * 16 * 16) + (11 * 16 * 16) + (10 * 16) + 10</code></p>
