<h1>Linux nohup 命令</h1><p class="post-meta"><time datetime="2022-09-27">2022-09-27</time> · <a href="../../categories/notes/index.html">随笔</a></p><article class="prose">
<p>nohup ./go_mqtt -mode=prod &gt; ~/log/go_mqtt.log &amp;</p>
<p>nohup 后台运行</p>
<p>./go_mqtt  GoLang 打包后的二进制文件</p>
<p>-mode=prod GoLang 运行携带的参数</p>
<p> ~/log/go_mqtt.log 输出日志到该文件</p>
<p>top 查看进程是否启动</p>
<p>每次执行前先把 进程 kill</p>
