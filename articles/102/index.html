<h1>ubuntu 挂载磁盘</h1><p class="post-meta"><time datetime="2024-04-22">2024-04-22</time> · <a href="../../categories/notes/index.html">随笔</a></p><article class="prose">
<pre><code class="language-shell">fdisk -l
mkfs.ext3 /dev/vdb
mkdir /data
mount /dev/vdb /data
echo &#39;/dev/vdb /data ext3 defaults 0 0&#39; &gt;&gt; /etc/fstab
df -h # 查看磁盘挂载信息
</code></pre>
