<h1>Mysql group by 排序</h1><p class="post-meta"><time datetime="2022-11-08">2022-11-08</time> · <a href="../../categories/notes/index.html">随笔</a></p><article class="prose">
<p>例：工资表（salary） 有 部门Id（department_id），员工Id（uid），工资（price）。需要查出各部门工资最高的员工</p>
<pre><code class="language-sql">SELECT *
FROM (SELECT * FROM salary HAVING 1 = 1 ORDER BY price DESC) AS A
GROUP BY A.department_id
</code></pre>
<p>主要运用到了子查询，性能可能较低。having 1 = 1 好像是取决于 mysql 版本，5.7 不加 having 不好用</p>
