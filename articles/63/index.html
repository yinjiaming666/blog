<h1>tmux 基本命令</h1><p class="post-meta"><time datetime="2023-02-22">2023-02-22</time> · <a href="../../categories/notes/index.html">随笔</a></p><article class="prose">
<ul>
<li>tmux ls 查看窗口列表</li>
<li>tmux new -s name 新建窗口</li>
<li>tmux attach -t name 切换到窗口</li>
<li>ctrl + b + d 退出窗口(先按 ctrl + b 松开后再按 d)</li>
<li>ctrl + b + [ 开启翻页模式</li>
<li>tmux kill-session -t name 删除窗口</li>
</ul>
