<h1>scp 基本使用</h1><p class="post-meta"><time datetime="2022-08-05">2022-08-05</time> · <a href="../../categories/notes/index.html">随笔</a></p><article class="prose">
<blockquote>
<p>上传文件夹 -r</p>
</blockquote>
<h2>上传</h2>
<p>上传文件夹 <code>local_dir</code> 本地文件夹，<code>remote_dir</code> 线上目录</p>
<pre><code class="language-shell">scp -r local_dir username@servername:remote_dir
</code></pre>
<h2>下载</h2>
<p>从服务器下载</p>
<pre><code class="language-shell">scp username@servername:/remote_path/remote_dir/filename ~/local_destination/filename
</code></pre>
