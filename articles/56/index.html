<h1>list() 快速把数组转换为一组变量</h1><p class="post-meta"><time datetime="2022-11-14">2022-11-14</time> · <a href="../../categories/php/index.html">PHP</a></p><article class="prose">
<p>​在php中，可用list()来将数组转化为一组变量，语法为“ list(变量1, 变量2, 变量3....) = $array; ”。list()函数可以在单次操作内把一个数组中的值分别赋给一组变量，数组元素的个数需要大于等于list()内的参数个数。</p>
