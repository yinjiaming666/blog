<h1>Mysql 大分页优化</h1><p class="post-meta"><time datetime="2022-11-08">2022-11-08</time> · <a href="../../categories/notes/index.html">随笔</a></p><article class="prose">
<pre><code class="language-sql">SELECT * FROM s_football_player ORDER BY id DESC LIMIT 760000, 10 -- 1.0s
</code></pre>
<p>可以通过子查询的方式优化</p>
<pre><code class="language-sql">SELECT *
FROM s_football_player
WHERE id &gt;= (SELECT id FROM s_football_player ORDER BY id DESC LIMIT 760000, 1)
LIMIT 10 -- 0.4s    
</code></pre>
