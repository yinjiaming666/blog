<h1>new 和 make 的区别</h1><p class="post-meta"><time datetime="2023-11-15">2023-11-15</time> · <a href="../../categories/go/index.html">Go</a></p><article class="prose">
<h1><code>make</code> 和 <code>new</code> 区别</h1>
<p><a href="https://zhuanlan.zhihu.com/p/666972979">参考地址</a></p>
<ul>
    <li>new 和 make 都是用于内存的分配</li>
    <li>make 只用于 chan，map，slice 的初始化。</li>
    <li>new 用于给类型分配内存空间，并且置零。</li>
    <li>make <b>返回类型本身</b>，new <b>返回指向类型的指针</b>。</li>
</ul>
